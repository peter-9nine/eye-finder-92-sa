<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input tests</title>
<style>
  body { margin: 0; font: 18px Tahoma, sans-serif; background: #e8eef5; color: #123; }
  button, select { font: inherit; padding: 6px 12px; }
  main { padding: 24px; }
  section { background: #fff; padding: 16px 20px; margin-bottom: 16px; border: 1px solid #b8c6d6; }
  section h2 { margin-top: 0; font-size: 20px; }
  #ticker { font-family: Consolas, monospace; }
  #bar { height: 12px; width: 60px; background: #0b4c8c; position: relative; }
  .filler { height: 140px; background: linear-gradient(90deg, #d7e4f2, #f7fafd); margin-bottom: 10px; padding: 10px; }
</style>
</head>
<body>
<main>
<section>
    <h2>Input test</h2>
    <p><button id="clicker">Click me</button> <span id="clicks">0 clicks</span></p>
    <p><input id="text" placeholder="Type here" style="font:inherit;padding:6px;width:320px"> <span id="echo"></span></p>
    <p><select id="dropdown"><option>Los Santos</option><option>San Fierro</option><option>Las Venturas</option></select>
       <span id="picked">Los Santos</span></p>
    <p><button id="runCleo">Run CLEO script</button> <span id="cleoResult"></span></p>
    <p>Reading the inbox from another site: <span id="crossSite">checking</span></p>
    <p>Real internet from this page: fetch <span id="netFetch">checking</span>, WebSocket <span id="netSocket">checking</span>, WebRTC <span id="netRtc">checking</span></p>
    <p id="media"></p>
    <p>Game state: <span id="gameState">checking</span></p>
    <p>Shared value from the game: <span id="pong">waiting</span></p>
  </section>
  <section>
    <h2>Animation test</h2>
    <p id="ticker">starting</p>
    <div id="bar"></div>
  </section>
  <section id="fillers"><h2>Scrolling test</h2></section>
</main>
<script src="/_game/sa.js"></script>
<script>
  const byId = (id) => document.getElementById(id);

let clicks = 0;
  byId('clicker').onclick = () => { byId('clicks').textContent = ++clicks + ' clicks'; };
  byId('text').oninput = (e) => { byId('echo').textContent = 'Typed: ' + e.target.value; };
  byId('runCleo').onclick = async () => {
    byId('cleoResult').textContent = (await sa.runScript('hello')) ? 'Sent to the game' : 'Refused';
  };

  // Debe fallar: otro origen no puede leer el correo, ni siquiera con la cabecera.
  fetch('https://mail.eyefinder.info/api/inbox', { headers: { 'X-EyeFinder': '1' } })
    .then(() => { byId('crossSite').textContent = 'ALLOWED (BAD)'; })
    .catch(() => { byId('crossSite').textContent = 'blocked'; });

  // Mide si esta página llega de verdad a internet: en modo local, ambos deben salir "blocked".
  fetch('https://example.com/', { mode: 'no-cors', cache: 'no-store' })
    .then(() => { byId('netFetch').textContent = 'reached'; })
    .catch(() => { byId('netFetch').textContent = 'blocked'; });
  try {
    const socket = new WebSocket('wss://ws.postman-echo.com/raw');
    socket.onopen = () => { byId('netSocket').textContent = 'reached'; socket.close(); };
    socket.onerror = () => { byId('netSocket').textContent = 'blocked'; };
  }
  catch (error) {
    byId('netSocket').textContent = 'blocked';
  }

  // WebRTC llega a internet si un servidor STUN le devuelve su dirección pública (srflx).
  const peer = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  peer.createDataChannel('test');
  byId('netRtc').textContent = 'blocked';
  peer.onicecandidate = (event) => {
    if (event.candidate && event.candidate.candidate.includes(' srflx ')) byId('netRtc').textContent = 'reached';
  };
  peer.createOffer().then((offer) => peer.setLocalDescription(offer));

  // Lo que documenta la FAQ para quienes crean sitios.
  const probe = document.createElement('video');
  const formats = { WebM: 'video/webm; codecs="vp9,opus"', Ogg: 'audio/ogg; codecs="opus"', MP3: 'audio/mpeg', 'H.264': 'video/mp4; codecs="avc1.42E01E"', AAC: 'audio/mp4; codecs="mp4a.40.2"' };
  byId('media').textContent = 'Media: ' + Object.entries(formats).map(([name, type]) => name + '=' + (probe.canPlayType(type) || 'no')).join(', ');

  sa.set('tests.ping', 'hello from the page');
  setInterval(async () => {
    const state = await sa.state();
    byId('gameState').textContent = '$' + state.money + ', ' + state.health + ' health, ' + state.wantedLevel + ' stars, ' + state.zone + ', day ' + state.day + ', mission ' + state.lastMission;
    byId('pong').textContent = await sa.get('tests.pong', 'waiting');
  }, 400);

  byId('dropdown').onchange = (e) => { byId('picked').textContent = e.target.value; };

  for (let i = 1; i <= 30; i++) {
    const row = document.createElement('div');
    row.className = 'filler';
    row.textContent = 'Row ' + i;
    byId('fillers').appendChild(row);
  }

  // Solo se anima con ?animate o al pulsar A, para medir el peor caso a voluntad.
  let animating = location.search.includes('animate');
  let frames = 0;
  let windowStart = performance.now();
  function tick(now) {
    frames++;
    if (now - windowStart >= 1000) {
      byId('ticker').textContent = Math.round(frames * 1000 / (now - windowStart)) + ' animation frames per second';
      frames = 0;
      windowStart = now;
    }
    byId('bar').style.left = (Math.sin(now / 500) * 200 + 200) + 'px';
    if (animating) requestAnimationFrame(tick);
  }
  if (animating) requestAnimationFrame(tick);
  else byId('ticker').textContent = 'Animation off. Open tests.html?animate to measure it.';
</script>
</body>
</html>
