<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EyeMail</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: #c0c0c0; color: #000; font: 15px Tahoma, sans-serif; }

  header { flex: none; display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: #000080; color: #fff; }
  header h1 { margin: 0; font: bold 22px "Times New Roman", serif; }
  #summary { flex: 1; }
  .filter { padding: 3px 12px; background: #c0c0c0; border: 2px outset #fff; color: #000; font: inherit; cursor: pointer; }
  .filter.active { border-style: inset; font-weight: bold; }

  #panes { flex: 1; min-height: 0; display: flex; gap: 6px; padding: 6px; }

  /* La lista: quién, de qué y un adelanto, para decidir sin abrir el correo. */
  #list { flex: 0 0 37%; min-width: 0; overflow-y: auto; background: #fff; border: 2px inset #fff; }
  .mail { position: relative; padding: 8px 10px 8px 24px; border-bottom: 1px solid #ccc; cursor: pointer; }
  .mail:hover { background: #e4ecfa; }
  .mail.selected { background: #000080; color: #fff; }
  .mailTop { display: flex; align-items: baseline; gap: 8px; }
  .sender { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 16px; }
  .date { flex: none; font-size: 12px; color: #555; }
  .subject, .preview { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .preview { font-size: 13px; color: #666; }
  .mail.selected .date, .mail.selected .preview { color: #d0d8f0; }
  .mail.unread .sender, .mail.unread .subject { font-weight: bold; }
  .mail.unread::before { content: ""; position: absolute; left: 8px; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: #0050d0; }
  .mail.selected.unread::before { background: #fff; }
  .needsAnswer { margin-left: 4px; padding: 0 4px; background: #d00000; color: #fff; font-size: 11px; font-weight: bold; }
  #empty { padding: 36px 16px; text-align: center; color: #555; }

  /* El correo abierto */
  #reader { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; border: 2px inset #fff; }
  #nothing { margin: auto; padding: 16px; text-align: center; color: #555; }
  #details { flex: none; padding: 10px 12px; background: #e8e8e8; border-bottom: 1px solid #808080; }
  #detailsTop { display: flex; align-items: flex-start; gap: 10px; }
  #readSubject { flex: 1; min-width: 0; margin: 0; font: bold 19px Tahoma, sans-serif; overflow-wrap: anywhere; }
  #remove { flex: none; padding: 3px 12px; font: inherit; }
  #readMeta { margin-top: 5px; color: #444; font-size: 13px; }
  #body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; font: 16px "Courier New", monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

  #replies { flex: none; padding: 10px; background: #e8e8e8; border-top: 1px solid #808080; }
  #replyPrompt { margin-bottom: 6px; font-weight: bold; }
  #replyButtons { display: flex; gap: 8px; }
  #replyButtons button { flex: 1 1 0; min-width: 0; min-height: 36px; padding: 4px 10px; font: inherit; cursor: pointer; }

  .replyCard { margin: 18px 0 4px; font: 15px Tahoma, sans-serif; background: #eef2fa; border: 1px solid #808080; border-left: 5px solid #000080; }
  .replyHeader { padding: 6px 10px; background: #000080; color: #fff; font-weight: bold; }
  .replyMeta { padding: 6px 10px 0; color: #444; font-size: 13px; }
  .replyText { padding: 6px 10px 10px; font: 16px "Courier New", monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .caret { display: inline-block; width: 9px; height: 1em; margin-left: 1px; vertical-align: text-bottom; background: #000; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <header>
    <h1>EyeMail</h1>
    <span id="summary"></span>
    <button class="filter active" id="showAll">All</button>
    <button class="filter" id="showUnread">Unread</button>
  </header>

  <div id="panes">
    <div id="list">
      <div id="rows"></div>
      <div id="empty" hidden></div>
    </div>

    <div id="reader">
      <div id="nothing">Select a message to read it.</div>
      <div id="details" hidden>
        <div id="detailsTop">
          <h2 id="readSubject"></h2>
          <button id="remove">Delete</button>
        </div>
        <div id="readMeta"></div>
      </div>
      <div id="body" hidden></div>
      <div id="replies" hidden>
        <div id="replyPrompt">Your answer:</div>
        <div id="replyButtons"><button id="replyGood"></button><button id="replyBad"></button></div>
      </div>
    </div>
  </div>

<script>
  const byId = (id) => document.getElementById(id);

  // La cabecera propia impide que otra web llame a esta API: sin CORS, el navegador lo bloquea.
  const call = (path, method = 'GET') =>
    fetch(path, { method, cache: 'no-store', headers: { 'X-EyeFinder': '1' } });

  let mails = [];
  let selectedId = null;
  let onlyUnread = false;
  let typing = null;  // { mailId, answer, text, shown, status, timer } mientras CJ escribe
  let audio = null;

  // El tecleo es un sonido sintetizado, sin archivos: un golpe muy corto de ruido.
  function playKey() {
    try {
      audio = audio || new AudioContext();
      const length = Math.floor(audio.sampleRate * 0.018);
      const buffer = audio.createBuffer(1, length, audio.sampleRate);
      const samples = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) samples[i] = (Math.random() * 2 - 1) * (1 - i / length);
      const gain = audio.createGain();
      gain.gain.value = 0.12;
      const source = audio.createBufferSource();
      source.buffer = buffer;
      source.connect(gain).connect(audio.destination);
      source.start();
    }
    catch (error) {
      // Sin sonido, el texto se sigue escribiendo.
    }
  }

  // El texto siempre entra como texto: un correo de otro mod no puede inyectar nada en la página.
  function fillBody(text) {
    const body = byId('body');
    body.textContent = '';
    const pattern = /https?:\/\/[^\s<>"']+/g;
    let last = 0;
    for (const match of text.matchAll(pattern)) {
      body.append(text.slice(last, match.index));
      const link = document.createElement('a');
      link.href = match[0];
      link.textContent = match[0];
      body.append(link);
      last = match.index + match[0].length;
    }
    body.append(text.slice(last));
  }

  const textElement = (className, text) => {
    const element = document.createElement('div');
    element.className = className;
    element.textContent = text;
    return element;
  };

  function buildRow(mail) {
    const row = document.createElement('div');
    row.className = 'mail' + (mail.read ? '' : ' unread') + (mail.id === selectedId ? ' selected' : '');

    const top = document.createElement('div');
    top.className = 'mailTop';
    top.append(textElement('sender', mail.from || '(no sender)'), textElement('date', mail.received));

    const subject = textElement('subject', (mail.answer ? '↩ ' : '') + (mail.subject || '(no subject)'));
    if (mail.replyKey && !mail.answer) {
      const tag = document.createElement('span');
      tag.className = 'needsAnswer';
      tag.textContent = 'ANSWER';
      subject.append(tag);
    }

    row.append(top, subject, textElement('preview', mail.body.replace(/\s+/g, ' ')));
    row.onclick = () => select(mail.id);
    return row;
  }

  function render() {
    const rows = byId('rows');
    const scroll = byId('list').scrollTop;
    rows.textContent = '';

    // Lo más reciente, arriba. Con el filtro, lo que se está leyendo no desaparece de golpe.
    const visible = [...mails].reverse().filter((mail) => !onlyUnread || !mail.read || mail.id === selectedId);
    for (const mail of visible) rows.append(buildRow(mail));
    byId('list').scrollTop = scroll;

    const unread = mails.filter((mail) => !mail.read).length;
    byId('summary').textContent = unread === 0 ? 'No new messages' : unread === 1 ? '1 new message' : unread + ' new messages';
    document.title = unread ? 'EyeMail (' + unread + ')' : 'EyeMail';

    byId('empty').hidden = visible.length > 0;
    byId('empty').textContent = mails.length === 0 ? 'Your mailbox is empty.' : "You've read everything.";
    byId('showAll').classList.toggle('active', !onlyUnread);
    byId('showUnread').classList.toggle('active', onlyUnread);
  }

  function buildReplyCard(mail, text, title, status) {
    const card = document.createElement('div');
    card.className = 'replyCard';

    const header = document.createElement('div');
    header.className = 'replyHeader';
    header.textContent = title;

    const meta = document.createElement('div');
    meta.className = 'replyMeta';
    meta.textContent = 'From: Carl Johnson  |  To: ' + mail.from + '  |  ' + status;

    const content = document.createElement('div');
    content.className = 'replyText';
    content.textContent = text;

    card.append(header, meta, content);
    return card;
  }

  function renderReader() {
    const mail = mails.find((item) => item.id === selectedId);
    byId('nothing').hidden = !!mail;
    byId('details').hidden = !mail;
    byId('body').hidden = !mail;
    if (!mail) {
      byId('replies').hidden = true;
      return;
    }

    byId('readSubject').textContent = mail.subject || '(no subject)';
    byId('readMeta').textContent = 'From: ' + mail.from + '  |  ' + mail.received;
    fillBody(mail.body);
    byId('body').scrollTop = 0;

    const isTyping = typing && typing.mailId === mail.id;
    byId('replies').hidden = !mail.replyKey || !!mail.answer || !!isTyping;
    byId('replyGood').textContent = mail.goodText || '';
    byId('replyBad').textContent = mail.badText || '';

    if (mail.answer) {
      byId('body').append(buildReplyCard(mail, mail.answer === 1 ? mail.goodText : mail.badText, 'Your reply', mail.answeredAt ? 'Sent: ' + mail.answeredAt : 'Sent'));
    }
    else if (isTyping) {
      const card = buildReplyCard(mail, typing.text.slice(0, typing.shown), typing.status, 'Not sent yet');
      if (typing.shown < typing.text.length) {
        const caret = document.createElement('span');
        caret.className = 'caret';
        card.querySelector('.replyText').append(caret);
      }
      byId('body').append(card);
      byId('body').scrollTop = byId('body').scrollHeight;
    }
  }

  function select(id) {
    finishTyping();
    selectedId = id;
    const mail = mails.find((item) => item.id === id);
    if (mail && !mail.read) {
      mail.read = true;
      call('/api/read/' + id, 'POST');
    }
    render();
    renderReader();
  }

  // CJ escribe la respuesta y luego se envía. Solo entonces cuenta como respondido.
  function answer(value) {
    const mail = mails.find((item) => item.id === selectedId);
    if (!mail || mail.answer || typing) return;

    const text = value === 1 ? mail.goodText : mail.badText;
    typing = { mailId: mail.id, answer: value, text, shown: 0, status: 'Writing your reply...', timer: null };
    renderReader();
    typeNextKey();
  }

  function typeNextKey() {
    if (!typing) return;

    if (typing.shown >= typing.text.length) {
      typing.status = 'Sending...';
      renderReader();
      typing.timer = setTimeout(finishTyping, 450);
      return;
    }

    typing.shown++;
    if (typing.text[typing.shown - 1] !== ' ') playKey();
    renderReader();

    // Un ritmo humano, y sin hacer esperar demasiado con las respuestas largas.
    const pace = Math.min(70, 3500 / typing.text.length);
    typing.timer = setTimeout(typeNextKey, pace * (0.6 + Math.random() * 0.8));
  }

  // Si el jugador cambia de correo mientras CJ escribe, la respuesta se envía igualmente.
  function finishTyping() {
    if (!typing) return;

    const done = typing;
    clearTimeout(done.timer);
    typing = null;

    const mail = mails.find((item) => item.id === done.mailId);
    if (mail && !mail.answer) {
      mail.answer = done.answer;
      mail.read = true;
      call('/api/reply/' + mail.id + '/' + done.answer, 'POST');
    }
    render();
    renderReader();
    byId('body').scrollTop = byId('body').scrollHeight;
  }

  byId('replyGood').onclick = () => answer(1);
  byId('replyBad').onclick = () => answer(2);

  byId('showAll').onclick = () => { onlyUnread = false; render(); };
  byId('showUnread').onclick = () => { onlyUnread = true; render(); };

  // Al borrar se abre el siguiente, para poder seguir limpiando la bandeja.
  byId('remove').onclick = () => {
    if (selectedId === null) return;
    finishTyping();

    const newestFirst = [...mails].reverse();
    const index = newestFirst.findIndex((mail) => mail.id === selectedId);
    const next = newestFirst[index + 1] || newestFirst[index - 1];

    call('/api/delete/' + selectedId, 'POST');
    mails = mails.filter((mail) => mail.id !== selectedId);
    selectedId = null;

    if (next) {
      select(next.id);
    }
    else {
      render();
      renderReader();
    }
  };

  async function refresh() {
    try {
      const response = await call('/api/inbox');
      if (!response.ok) return;
      const data = await response.json();
      const fresh = data.mail.mails;

      // Una operación puede estar en camino: lo que el jugador acaba de hacer manda.
      const known = new Map(mails.map((mail) => [mail.id, mail]));
      for (const mail of fresh) {
        const old = known.get(mail.id);
        if (old?.read) mail.read = true;
        if (old?.answer) mail.answer = old.answer;
      }
      if (JSON.stringify(fresh) === JSON.stringify(mails)) return;

      const wasReading = selectedId;
      const dateBefore = known.get(wasReading)?.answeredAt;
      mails = fresh;
      if (wasReading !== null && !mails.some((mail) => mail.id === wasReading)) selectedId = null;
      render();
      const scroll = byId('body').scrollTop;
      const dateNow = mails.find((mail) => mail.id === selectedId)?.answeredAt;
      if (selectedId !== wasReading) {
        renderReader();
      }
      else if (dateNow !== dateBefore && !typing) {
        // La fecha real llega del juego justo después de enviar.
        renderReader();
        byId('body').scrollTop = scroll;
      }
    }
    catch (error) {
      // El archivo se puede estar sustituyendo justo ahora: se reintenta en la siguiente vuelta.
    }
  }

  renderReader();
  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
