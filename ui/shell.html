<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EyeFinder Shell</title>
<style>
  :root {
    --grey: #c0c0c0;
    --light: #ffffff;
    --dark: #808080;
    --darker: #404040;
    --title-font: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --ui-font: Tahoma, "MS Sans Serif", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body { font: 14px var(--ui-font); color: #000; background: #037575; }

  /* Escritorio: el arte original, con las zonas clicables encima. */
  #desktop { position: fixed; inset: 0; background: url("img/desktop.png") center / 100% 100% no-repeat; }
  .icon { position: absolute; background: none; border: 0; padding: 0; cursor: pointer; outline: 0; }
  .icon:hover, .icon:focus-visible { outline: 2px dotted #fff; outline-offset: 2px; }
  #iconHopes { left: 1.6%; top: 2.8%; width: 9.4%; height: 16.2%; }
  #iconInternet { left: 29.5%; top: 37.8%; width: 8.9%; height: 18.7%; }
  #iconLogOff { left: 60.8%; top: 64%; width: 8.3%; height: 18.6%; }

  #iconMail { position: absolute; left: 2.2%; top: 23%; width: 8%; padding: 0; background: none; border: 0; outline: 0; color: #fff; font: 2.7vh Georgia, "Bookman Old Style", serif; text-align: center; cursor: pointer; }
  #iconMail:hover, #iconMail:focus-visible { outline: 2px dotted #fff; outline-offset: 2px; }
  #iconMail svg { display: block; width: 58%; margin: 0 auto 2px; shape-rendering: crispEdges; }
  .badge { display: none; min-width: 1.5em; padding: 0 4px; background: #d00000; border: 1px solid #fff; color: #fff; font: bold 12px Tahoma, sans-serif; line-height: 16px; text-align: center; }
  #iconMail .badge { position: absolute; top: 0; right: 16%; font-size: 2vh; line-height: 2.8vh; }
  #mail { position: relative; }
  #mail .badge { position: absolute; top: -5px; right: -5px; }

  #hopesNote { position: absolute; left: 1.6%; top: 19.5%; padding: 4px 8px; background: #ffffcc; border: 1px solid #000; font-size: 13px; display: none; }

  /* Ventana minimizada: un icono abajo, como en los escritorios de la época. */
  #minimized { position: absolute; left: 12px; bottom: 10px; width: 96px; padding: 4px; background: none; border: 0; color: #fff; font: 13px var(--ui-font); text-align: center; cursor: pointer; display: none; }
  #minimized .globe { display: block; width: 36px; height: 36px; margin: 0 auto 4px; background: var(--grey); border: 2px outset #fff; line-height: 30px; color: #000; font-weight: bold; }

  /* Ventana del navegador */
  #window { position: fixed; top: 0; bottom: 0; left: 50%; width: min(100vw, calc(100vh * 4 / 3)); transform: translateX(-50%); display: none; flex-direction: column; background: var(--grey); border: 2px solid; border-color: var(--light) var(--darker) var(--darker) var(--light); }
  #window.maximized { left: 0; width: 100vw; transform: none; }

  #titleBar { flex: none; height: 28px; display: flex; align-items: center; padding: 0 3px 0 10px; color: #fff; background: linear-gradient(90deg, #000080, #1084d0); font: bold 15px var(--title-font); }
  #titleText { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bevel { background: var(--grey); border: 2px solid; border-color: var(--light) var(--darker) var(--darker) var(--light); color: #000; font: 14px var(--ui-font); padding: 0; cursor: pointer; }
  .bevel:active:not(:disabled) { border-color: var(--darker) var(--light) var(--light) var(--darker); }
  .bevel:disabled { color: var(--dark); text-shadow: 1px 1px 0 #fff; cursor: default; }
  #titleBar .bevel { width: 22px; height: 20px; margin-left: 2px; font-weight: bold; line-height: 14px; }

  #toolbar { flex: none; height: 42px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-bottom: 1px solid var(--dark); }
  #toolbar .bevel { width: 36px; height: 30px; font-size: 17px; line-height: 20px; }
  #toolbar #go { width: 44px; font-size: 14px; }
  #address { flex: 1; min-width: 0; height: 28px; margin: 0 4px; padding: 0 6px; background: #fff; border: 2px solid; border-color: var(--dark) var(--light) var(--light) var(--dark); font: 15px var(--ui-font); outline: 0; user-select: text; }

  #netMode { width: 88px !important; font-size: 12px !important; font-weight: bold; }
  #netMode.internet { background: #c00000; color: #fff; text-shadow: none; }

  /* Aviso de la época. Mientras está abierto, la pestaña se oculta: se compone por encima de la interfaz. */
  #alertShade { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
  #alertBox { width: 560px; max-width: calc(100vw - 32px); background: var(--grey); border: 2px solid; border-color: var(--light) var(--darker) var(--darker) var(--light); }
  #alertTitle { height: 26px; line-height: 26px; padding: 0 10px; color: #fff; background: linear-gradient(90deg, #800000, #d04010); font: bold 15px var(--title-font); }
  #alertBody { display: flex; gap: 14px; padding: 16px; }
  #alertIcon { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #d00000; border: 2px solid #000; color: #fff; font: bold 28px/36px Georgia, serif; text-align: center; }
  #alertText p { margin: 0 0 8px; }
  #alertUrl { font-family: "Courier New", monospace; font-size: 13px; overflow-wrap: anywhere; }
  #alertButtons { display: flex; justify-content: center; gap: 20px; padding: 0 16px 16px; }
  #alertButtons .bevel { width: 170px; height: 32px; }

  #tabBar { flex: none; height: 30px; display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 0; overflow: hidden; }
  .tab { flex: 0 1 190px; min-width: 60px; height: 25px; display: flex; align-items: center; padding: 0 3px 0 8px; background: #b0b0b0; border: 2px solid; border-bottom: 0; border-color: var(--light) var(--darker) transparent var(--light); cursor: pointer; }
  .tab.active { height: 26px; background: var(--grey); font-weight: bold; }
  .tabTitle { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; }
  .tabClose { flex: none; width: 17px; height: 17px; margin-left: 4px; font-size: 11px; line-height: 11px; }
  #newTab { flex: none; width: 26px; height: 22px; margin-bottom: 1px; font-weight: bold; }

  /* Hueco donde el helper compone la pestaña activa. */
  #content { flex: 1; min-height: 0; margin: 0 6px; background: #fff; border: 0; }
  #statusBar { flex: none; height: 26px; display: flex; align-items: center; gap: 3px; padding: 0 2px 0 8px; margin: 2px 6px 2px; border: 1px solid; border-color: var(--dark) var(--light) var(--light) var(--dark); font-size: 13px; }
  #statusText { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #statusBar .bevel { height: 20px; min-width: 22px; font-size: 13px; line-height: 12px; }
  #zoomValue { width: 48px; }
</style>
</head>
<body>
<div id="desktop">
  <button class="icon" id="iconHopes" title="My Hopes and Dreams"></button>
  <button class="icon" id="iconInternet" title="Internet"></button>
  <button class="icon" id="iconLogOff" title="Log Off"></button>
  <button id="iconMail" title="Mail">
    <svg viewBox="0 0 32 24" aria-hidden="true">
      <rect x="1" y="1" width="30" height="22" fill="#000"/>
      <rect x="2" y="2" width="28" height="20" fill="#fff"/>
      <rect x="2" y="2" width="28" height="2" fill="#ffffc8"/>
      <path d="M3 4h2v1h2v1h2v1h2v1h2v1h2v1h2V9h2V8h2V7h2V6h2V5h2V4h2v2h-2v1h-2v1h-2v1h-2v1h-2v1h-2v1h-4v-1h-2v-1h-2V9H9V8H7V7H5V6H3z" fill="#000"/>
      <path d="M3 19h2v-1h2v-1h2v-1h2v1H9v1H7v1H5v1H3zM29 19h-2v-1h-2v-1h-2v-1h-2v1h2v1h2v1h2v1h2z" fill="#808080"/>
    </svg>
    Mail
    <span class="badge" id="desktopBadge"></span>
  </button>
  <div id="hopesNote">This folder is empty.</div>
  <button id="minimized"><span class="globe">www</span>Web Browser</button>
</div>

<div id="window">
  <div id="titleBar">
    <div id="titleText">SAN ANDREAS - WEB BROWSER</div>
    <button class="bevel" id="minimize" title="Minimize">_</button>
    <button class="bevel" id="maximize" title="Maximize">□</button>
    <button class="bevel" id="close" title="Close">X</button>
  </div>
  <div id="toolbar">
    <button class="bevel" id="back" title="Back (Alt+Left)" disabled>←</button>
    <button class="bevel" id="forward" title="Forward (Alt+Right)" disabled>→</button>
    <button class="bevel" id="reload" title="Reload (F5)">↻</button>
    <button class="bevel" id="home" title="Home">⌂</button>
    <button class="bevel" id="mail" title="Mail">✉<span class="badge" id="toolbarBadge"></span></button>
    <input id="address" spellcheck="false" autocomplete="off" aria-label="Address">
    <button class="bevel" id="go">Go</button>
    <button class="bevel" id="netMode" title="Local sites only. Click to connect to the real internet.">LOCAL</button>
  </div>
  <div id="tabBar">
    <button class="bevel" id="newTab" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="content"></div>
  <div id="statusBar">
    <div id="statusText"></div>
    <button class="bevel" id="zoomOut" title="Zoom out (Ctrl+-)">-</button>
    <button class="bevel" id="zoomValue" title="Reset the zoom (Ctrl+0)">100%</button>
    <button class="bevel" id="zoomIn" title="Zoom in (Ctrl++)">+</button>
  </div>
</div>

<div id="alertShade" role="alertdialog" aria-labelledby="alertTitle">
  <div id="alertBox">
    <div id="alertTitle">Connect to the real internet?</div>
    <div id="alertBody">
      <div id="alertIcon">!</div>
      <div id="alertText">
        <p id="alertReason"></p>
        <p id="alertUrl"></p>
        <p>You will leave the sites stored with the mod. Real websites can see your real IP address, and this browser has no security sandbox. Only visit sites you trust, and don't log in to your accounts.</p>
      </div>
    </div>
    <div id="alertButtons">
      <button class="bevel" id="alertConnect">Connect</button>
      <button class="bevel" id="alertStay">Stay local</button>
    </div>
  </div>
</div>

<script>
  const HOME = 'https://www.eyefinder.info/';
  const MAIL = 'https://mail.eyefinder.info/';
  const MAX_TABS = 8;
  const byId = (id) => document.getElementById(id);

  const send = (message) => {
    if (window.cefQuery) window.cefQuery({ request: JSON.stringify(message), onSuccess() {}, onFailure() {} });
  };

  let tabs = [];
  let activeId = -1;
  let nextId = 1;
  let windowState = 'closed';  // closed, open o minimized
  let internet = false;
  let pendingInternet = null;  // { url, newTab } mientras el aviso está abierto

  const activeTab = () => tabs.find((tab) => tab.id === activeId);

  function sendLayout() {
    const rect = byId('content').getBoundingClientRect();
    send({
      cmd: 'layout',
      x: Math.round(rect.left), y: Math.round(rect.top), w: Math.round(rect.width), h: Math.round(rect.height),
      visible: windowState === 'open' && tabs.length > 0 && !pendingInternet,
    });
  }

  function setWindowState(state) {
    windowState = state;
    byId('window').style.display = state === 'open' ? 'flex' : 'none';
    byId('minimized').style.display = state === 'minimized' ? 'block' : 'none';
    sendLayout();
  }

  function render() {
    for (const element of document.querySelectorAll('.tab')) element.remove();
    const newTabButton = byId('newTab');

    for (const tab of tabs) {
      const element = document.createElement('div');
      element.className = 'tab' + (tab.id === activeId ? ' active' : '');
      element.onmousedown = () => activateTab(tab.id);

      const title = document.createElement('span');
      title.className = 'tabTitle';
      title.textContent = (tab.loading ? '… ' : '') + (tab.title || tab.url || 'New tab');
      element.appendChild(title);

      const close = document.createElement('button');
      close.className = 'bevel tabClose';
      close.textContent = 'X';
      close.title = 'Close tab (Ctrl+W)';
      close.onmousedown = (event) => event.stopPropagation();
      close.onclick = () => closeTab(tab.id);
      element.appendChild(close);

      byId('tabBar').insertBefore(element, newTabButton);
    }

    newTabButton.disabled = tabs.length >= MAX_TABS;

    const tab = activeTab();
    byId('back').disabled = !tab || !tab.back;
    byId('forward').disabled = !tab || !tab.forward;
    byId('zoomValue').textContent = ((tab && tab.zoom) || 100) + '%';
    byId('reload').textContent = tab && tab.loading ? '✕' : '↻';
    byId('reload').title = tab && tab.loading ? 'Stop' : 'Reload (F5)';
    byId('titleText').textContent = 'SAN ANDREAS - WEB BROWSER' + (tab && tab.title ? ' - ' + tab.title : '');
    if (document.activeElement !== byId('address')) byId('address').value = tab ? displayUrl(tab.url) : '';
  }

  const displayUrl = (url) => (url || '').replace(/^data:.*/, '');

  // El correo se abre una sola vez: si ya hay una pestaña, se vuelve a ella.
  function openMail() {
    const existing = tabs.find((tab) => (tab.url || '').startsWith(MAIL));
    if (!existing) {
      if (tabs.length < MAX_TABS) openTab(MAIL);
      else { setWindowState('open'); send({ cmd: 'navigate', url: MAIL }); }
      return;
    }
    activateTab(existing.id);
    setWindowState('open');
  }

  function openTab(url) {
    if (tabs.length >= MAX_TABS) return;
    const id = nextId++;
    tabs.push({ id, url, title: '', loading: true, back: false, forward: false });
    send({ cmd: 'openTab', id, url });
    activateTab(id);
    setWindowState('open');
  }

  function activateTab(id) {
    activeId = id;
    byId('address').blur();
    send({ cmd: 'activateTab', id });
    byId('statusText').textContent = '';
    render();
  }

  function closeTab(id) {
    const index = tabs.findIndex((tab) => tab.id === id);
    if (index < 0) return;
    tabs.splice(index, 1);
    send({ cmd: 'closeTab', id });

    if (tabs.length === 0) {
      activeId = -1;
      setWindowState('closed');
    }
    else if (id === activeId) {
      activateTab(tabs[Math.min(index, tabs.length - 1)].id);
    }
    render();
  }

  function cycleTab(step) {
    if (tabs.length < 2) return;
    const index = tabs.findIndex((tab) => tab.id === activeId);
    activateTab(tabs[(index + step + tabs.length) % tabs.length].id);
  }

  // Una dirección, o si no lo parece, una búsqueda.
  function toUrl(text) {
    const value = text.trim();
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
    if (/^[^\s]+\.[^\s]+$/.test(value)) return 'https://' + value;
    return 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
  }

  function navigate() {
    const value = byId('address').value;
    if (!value.trim()) return;
    byId('address').blur();
    const url = toUrl(value);
    if (activeTab()) send({ cmd: 'navigate', url });
    else openTab(url);
  }

  // Siempre se pregunta: no hay "no volver a preguntar".
  function askForInternet(url, newTab) {
    pendingInternet = { url, newTab };
    byId('alertReason').textContent = url
      ? 'This address is on the real internet, and you are browsing local sites only:'
      : 'You are browsing local sites only.';
    byId('alertUrl').textContent = url || '';
    byId('alertUrl').style.display = url ? 'block' : 'none';
    byId('address').blur();
    byId('alertShade').style.display = 'flex';
    sendLayout();
  }

  function closeInternetAlert() {
    pendingInternet = null;
    byId('alertShade').style.display = 'none';
    sendLayout();
  }

  function setInternet(enabled) {
    internet = enabled;
    send({ cmd: 'setInternet', enabled });
    byId('netMode').textContent = enabled ? 'INTERNET' : 'LOCAL';
    byId('netMode').classList.toggle('internet', enabled);
    byId('netMode').title = enabled ? 'Connected to the real internet. Click to go back to local sites only.' : 'Local sites only. Click to connect to the real internet.';
  }

  // --- Llamadas desde el helper ---
  window.ef = {
    onTab(state) {
      const tab = tabs.find((item) => item.id === state.id);
      if (tab) Object.assign(tab, state);
      render();
    },
    onBlocked(details) { askForInternet(details.url, details.newTab); },
    onMail(unread) {
      for (const badge of [byId('desktopBadge'), byId('toolbarBadge')]) {
        badge.textContent = unread > 99 ? '99+' : unread;
        badge.style.display = unread > 0 ? 'block' : 'none';
      }
    },
    onStatus(text) { byId('statusText').textContent = text; },
    openTab,
    shortcut(action) {
      if (windowState !== 'open') return;
      if (action === 'newTab') openTab(HOME);
      else if (action === 'closeTab') closeTab(activeId);
      else if (action === 'nextTab') cycleTab(1);
      else if (action === 'previousTab') cycleTab(-1);
      else if (action === 'focusAddress') { byId('address').focus(); byId('address').select(); }
    },
  };

  // --- Escritorio ---
  byId('iconInternet').onclick = () => {
    if (tabs.length) setWindowState('open');
    else openTab(HOME);
  };
  byId('iconMail').onclick = openMail;
  byId('mail').onclick = openMail;
  byId('iconLogOff').onclick = () => send({ cmd: 'logOff' });
  byId('iconHopes').onclick = () => {
    const note = byId('hopesNote');
    note.style.display = 'block';
    setTimeout(() => { note.style.display = 'none'; }, 2500);
  };
  byId('minimized').onclick = () => setWindowState('open');

  // --- Ventana ---
  byId('minimize').onclick = () => setWindowState('minimized');
  byId('close').onclick = () => {
    for (const tab of [...tabs]) closeTab(tab.id);
    setWindowState('closed');
  };
  byId('maximize').onclick = () => {
    byId('window').classList.toggle('maximized');
    sendLayout();
  };
  byId('netMode').onclick = () => {
    if (internet) setInternet(false);
    else askForInternet('', false);
  };
  byId('alertConnect').onclick = () => {
    const { url, newTab } = pendingInternet;
    setInternet(true);
    closeInternetAlert();
    if (!url) return;
    if (newTab) openTab(url);
    else send({ cmd: 'navigate', url });
  };
  byId('alertStay').onclick = closeInternetAlert;
  byId('zoomIn').onclick = () => send({ cmd: 'zoom', direction: 1 });
  byId('zoomOut').onclick = () => send({ cmd: 'zoom', direction: -1 });
  byId('zoomValue').onclick = () => send({ cmd: 'zoom', direction: 0 });
  byId('back').onclick = () => send({ cmd: 'back' });
  byId('forward').onclick = () => send({ cmd: 'forward' });
  byId('reload').onclick = () => {
    const tab = activeTab();
    send({ cmd: tab && tab.loading ? 'stop' : 'reload' });
  };
  byId('home').onclick = () => send({ cmd: 'navigate', url: HOME });
  byId('go').onclick = navigate;
  byId('newTab').onclick = () => openTab(HOME);
  byId('address').addEventListener('keydown', (event) => { if (event.key === 'Enter') navigate(); });
  byId('address').addEventListener('focus', () => byId('address').select());
  byId('address').addEventListener('mouseup', (event) => event.preventDefault());
  byId('address').addEventListener('blur', render);

  new ResizeObserver(sendLayout).observe(byId('content'));
  sendLayout();
</script>
</body>
</html>
